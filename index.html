<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery - Zadanie 5</title>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <style>
        .link {
            color: grey;
            text-decoration: none;
        }

        .another_link {
            background-color: black;
        }

        .completely_different_link {
            background-color: yellow;
        }

        .a {
            background-color: red;
        }

        .b {
            font-size: 150%;
        }
    </style>
</head>

<body>

    <h1>Linki</h1>

    <a href="#" class="link">Minecraft</a><br>
    <a href="#">Cyberpunk 2077</a><br>
    <a href="#" class="link">Elden Ring</a><br>
    <a href="#">Bloodborne</a>

    <p>To jest przykładowy tekst.</p>

    <button id="przycisk">Usuń klasy</button>

    <script>

        $(function(){
         $("a").eq(1).addClass("another_link")  //ćwiczenie 1
         $("a").eq(2).removeClass("link") //ćwiczenie 2
         $("p").addClass("a").addClass("b")  //ćwiczenie 3
         $("#przycisk").click(function(){
            $("p").removeClass("a").removeClass("b")
            alert("SUKCES!")
         }) //ćwiczenie 4 
// Wszytskie ćwiczenia to ćwiczenie 5 !
        });

    </script>

</body>
</html>
